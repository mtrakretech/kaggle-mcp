[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-mcp"
version = "2.1.0"
description = "Full Kaggle API as an MCP server (25 tools) for Claude Desktop, Claude Code, Codex, Cursor, Hermes, Windsurf, OpenCode, and more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mtrakretech" }]
keywords = ["mcp", "kaggle", "model-context-protocol", "claude", "codex", "cursor", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "requests>=2.28",
  "kaggle>=1.6",
]

[project.urls]
Homepage = "https://github.com/mtrakretech/kaggle-mcp"
Repository = "https://github.com/mtrakretech/kaggle-mcp"
Issues = "https://github.com/mtrakretech/kaggle-mcp/issues"

[project.scripts]
kaggle-mcp = "kaggle_mcp:main"

[tool.setuptools]
py-modules = ["kaggle_mcp"]
